services:
  - type: web
    name: axion-process-os
    runtime: docker
    plan: starter
    healthCheckPath: /api/health
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: 8899
      - key: PRODUCT_NAME
        value: Axion Process OS
      - key: APP_BASE_URL
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: AXION_ADMIN_USER
        value: owner
      - key: AXION_ADMIN_PASSWORD
        sync: false
      - key: AXION_PRICE_CENTS
        value: "240000"
      - key: AXION_CURRENCY
        value: EUR
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_STATE_TABLE
        value: axion_state
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PRICE_ID
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_ALLOWED_DOMAINS
        sync: false
      - key: GOOGLE_ALLOWED_EMAILS
        sync: false
      - key: INVITE_EMAIL_FROM
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: CFD_WORKER_URL
        sync: false
      - key: CFD_WORKER_TOKEN
        sync: false
