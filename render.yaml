services:
  - type: web
    name: axion-process-os
    runtime: docker
    plan: starter
    healthCheckPath: /api/health
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: 8899
      - key: PRODUCT_NAME
        value: Axion Process OS
      - key: APP_BASE_URL
        sync: false
      - key: AXION_REQUIRE_PRODUCTION_CONFIG
        value: "true"
      - key: SESSION_SECRET
        generateValue: true
      - key: AXION_ADMIN_USER
        value: owner
      - key: AXION_ADMIN_PASSWORD
        sync: false
      - key: AXION_PRICE_CENTS
        value: "240000"
      - key: AXION_CURRENCY
        value: EUR
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_STATE_TABLE
        value: axion_state
      - key: SUPABASE_DOCUMENTS_TABLE
        value: axion_documents
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PRICE_ID
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_ALLOWED_DOMAINS
        sync: false
      - key: GOOGLE_ALLOWED_EMAILS
        sync: false
      - key: INVITE_EMAIL_FROM
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4.1-mini
      - key: CFD_WORKER_URL
        sync: false
      - key: CFD_WORKER_TOKEN
        sync: false
      - key: NEXTJS_BFF_URL
        sync: false

  - type: web
    name: axion-nextjs-bff
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile.nextjs
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: 3000
      - key: AXION_API_BASE_URL
        sync: false

  - type: web
    name: axion-cfd-worker
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile.cfd-worker
    healthCheckPath: /health
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: 8787
      - key: CFD_WORKER_TOKEN
        sync: false
      - key: CFD_JOBS_DIR
        value: /data/cfd-jobs
      - key: OPENFOAM_SOLVER
        value: interFoam
      - key: AXION_CFD_DRY_RUN
        value: "true"
