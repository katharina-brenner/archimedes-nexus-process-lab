name: Axion CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.12.1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Syntax check
        run: pnpm run check

      - name: Backend API tests
        run: pnpm test

      - name: OT site-pack and container policy checks
        run: |
          pnpm gateway:site:check -- --source automation-gateway/site-pack.example --template
          pnpm gateway:container:check

      - name: Build automation edge image
        run: docker build -f Dockerfile.automation-gateway -t axion-automation-gateway:ci .

      - name: Production doctor expected local failure
        run: |
          set +e
          pnpm run doctor
          status=$?
          if [ "$status" -eq 0 ]; then
            echo "Local CI doctor should fail without production secrets."
            exit 1
          fi
          echo "Doctor correctly reports missing production secrets in CI."

      - name: Static build
        run: pnpm run build
