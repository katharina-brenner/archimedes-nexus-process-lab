services:
  axion-api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8899:8899"
    env_file:
      - .env
    environment:
      HOST: 0.0.0.0
      PORT: 8899
      AXION_REQUIRE_PRODUCTION_CONFIG: "true"
      CFD_WORKER_URL: http://axion-cfd-worker:8787
    depends_on:
      - axion-cfd-worker

  axion-cfd-worker:
    build:
      context: .
      dockerfile: Dockerfile.cfd-worker
      args:
        BASE_IMAGE: python:3.12-slim
    restart: unless-stopped
    env_file:
      - .env
    environment:
      HOST: 0.0.0.0
      PORT: 8787
      CFD_JOBS_DIR: /data/cfd-jobs
      OPENFOAM_SOLVER: interFoam
      AXION_CFD_DRY_RUN: "true"
    volumes:
      - axion-cfd-jobs:/data/cfd-jobs

volumes:
  axion-cfd-jobs:
